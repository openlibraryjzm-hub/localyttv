<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; background-color: black; width: 100vw; height: 100vh; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var videoId = 'dQw4w9WgXcQ'; // Default placeholder

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'fs': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'autohide': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            sendMessage('READY', {});
        }

        function onPlayerStateChange(event) {
            // event.data: -1 (unstarted), 0 (ended), 1 (playing), 2 (paused), 3 (buffering), 5 (video cued)
            sendMessage('STATE_CHANGE', { state: event.data });
            
            if (event.data === YT.PlayerState.PLAYING) {
                startTracking();
            } else {
                stopTracking();
            }
        }

        function onPlayerError(event) {
            sendMessage('ERROR', { code: event.data });
        }

        var trackingInterval;
        function startTracking() {
            stopTracking();
            trackingInterval = setInterval(function() {
                if (player && player.getCurrentTime) {
                    sendMessage('TIME_UPDATE', {
                        currentTime: player.getCurrentTime(),
                        duration: player.getDuration()
                    });
                }
            }, 1000);
        }

        function stopTracking() {
            if (trackingInterval) clearInterval(trackingInterval);
        }

        function sendMessage(type, payload) {
            var message = { type: type, payload: payload };
            // MAUI URL Interception Bridge
            window.location.href = 'maui-bridge://' + encodeURIComponent(JSON.stringify(message));
        }

        // Methods called from C#
        window.loadVideo = function(id) {
            if (player && player.loadVideoById) {
                player.loadVideoById(id);
            } else {
                videoId = id;
            }
        };

        window.seekTo = function(seconds) {
            if (player && player.seekTo) {
                player.seekTo(seconds, true);
            }
        };

        window.playVideo = function() {
            if (player && player.playVideo) player.playVideo();
        };

        window.pauseVideo = function() {
            if (player && player.pauseVideo) player.pauseVideo();
        };
    </script>
</body>
</html>
